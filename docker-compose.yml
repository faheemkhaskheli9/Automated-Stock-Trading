# Local container parity for the full stack (web + Celery worker + Celery
# beat + Postgres + Redis) - not a production deployment manifest. In the
# cloud, Postgres/Redis are managed services and a managed scheduler
# (EventBridge/Cloud Scheduler - see docs/PLAN.md, Phase 5) replaces `beat`.
#
# Usage:
#   cp .env.example .env   # then set SECRET_KEY/ALLOWED_HOSTS for this file
#   docker compose up --build

x-app: &app
  build: .
  environment: &app-env
    DJANGO_SETTINGS_MODULE: AutomaticStockTrading.settings.prod
    DATABASE_URL: postgres://trading:trading@postgres:5432/trading
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    # No TLS terminator in front of this local stack - real deployments
    # leave SECURE_SSL_REDIRECT at its secure-by-default True (see
    # settings/prod.py) because they DO sit behind HTTPS.
    SECURE_SSL_REDIRECT: "false"
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn AutomaticStockTrading.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A AutomaticStockTrading worker -l info

  beat:
    <<: *app
    command: >
      celery -A AutomaticStockTrading beat -l info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  postgres_data:
