[pytest]
DJANGO_SETTINGS_MODULE = AutomaticStockTrading.settings.dev
python_files = tests.py test_*.py *_tests.py
# `artifacts/` is a gitignored scratch tree for trained model dumps and ad-hoc
# run output - never test code, and its subdirs can carry locked permissions
# that abort collection on Windows. Keep pytest out of it.
norecursedirs = artifacts .venv .git
