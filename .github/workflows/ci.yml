name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: black --check .
      - run: isort --check-only .
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key
      DJANGO_SETTINGS_MODULE: AutomaticStockTrading.settings.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python manage.py migrate
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Builds only - doesn't push. No registry/credentials are configured yet;
      # wiring this to a registry + a cloud deploy is Phase 5's remaining
      # open choice (see docs/PLAN.md). This still catches a broken
      # Dockerfile/build on every push/PR.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
